<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Регистрация</title>
    <meta charset="UTF-8">
</head>
<body>

<h2>Регистрация</h2>

<div th:if="${errorMessage}" style="color: red;" th:text="${errorMessage}"></div>
<div th:if="${successMessage}" style="color: green;" th:text="${successMessage}"></div>

<form th:action="@{/register}" th:object="${registration}" method="post">
    <input type="text" th:field="*{name}" placeholder="Логин"/><br>
    <span style="color:red" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></span><br>

    <input type="email" th:field="*{email}" placeholder="Email"/><br>
    <span style="color:red" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span><br>

    <input type="password" th:field="*{password}" placeholder="Пароль"/><br>
    <span style="color:red" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></span><br>

    <button type="submit">Зарегистрироваться</button>
</form>

<a href="/login">Уже есть аккаунт? Войти</a>

</body>
</html>
